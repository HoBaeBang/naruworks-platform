services:
  postgres:
    image: postgres:17-alpine
    container_name: naruworks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naruworks_local}
      POSTGRES_USER: ${POSTGRES_USER:-naruworks_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
    ports:
      - "5432:5432"
    volumes:
      - naruworks-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naruworks-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      POSTGRES_DB: ${POSTGRES_DB:-naruworks_local}
      POSTGRES_USER: ${POSTGRES_USER:-naruworks_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_LOGIN_REDIRECT_URI: ${AUTHENTIK_LOGIN_REDIRECT_URI:-https://api.naruworks.com/login/oauth2/code/authentik}
      AUTHENTIK_ISSUER_URI: ${AUTHENTIK_ISSUER_URI:-https://idp.naruworks.com/application/o/naru-api/}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-https://api.naruworks.com/api/calendar/integrations/google/callback}
      GOOGLE_CALENDAR_TOKEN_ENCRYPTION_KEY: ${GOOGLE_CALENDAR_TOKEN_ENCRYPTION_KEY:-}
      NARU_GOOGLE_CALENDAR_SYNC_ENABLED: ${NARU_GOOGLE_CALENDAR_SYNC_ENABLED:-true}
      NARU_GOOGLE_CALENDAR_SYNC_INITIAL_DELAY: ${NARU_GOOGLE_CALENDAR_SYNC_INITIAL_DELAY:-PT1M}
      NARU_GOOGLE_CALENDAR_SYNC_FIXED_DELAY: ${NARU_GOOGLE_CALENDAR_SYNC_FIXED_DELAY:-PT30M}
      NARU_INITIAL_ADMIN_EMAIL: ${NARU_INITIAL_ADMIN_EMAIL:-}
      NARU_DRIVE_S3_ENDPOINT: ${NARU_DRIVE_S3_ENDPOINT:-http://rustfs:9000}
      NARU_DRIVE_S3_BUCKET: ${NARU_DRIVE_S3_BUCKET:-naru-drive}
      NARU_DRIVE_S3_ACCESS_KEY: ${NARU_DRIVE_S3_ACCESS_KEY:-}
      NARU_DRIVE_S3_SECRET_KEY: ${NARU_DRIVE_S3_SECRET_KEY:-}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081}
    container_name: naruworks-frontend
    restart: unless-stopped
    environment:
      CATALOG_API_BASE_URL: ${CATALOG_API_BASE_URL:-http://backend:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  authentik-postgres:
    image: postgres:16-alpine
    container_name: naruworks-authentik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASSWORD:?AUTHENTIK_PG_PASSWORD is required}
    volumes:
      - naruworks-authentik-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.5
    container_name: naruworks-authentik-server
    restart: unless-stopped
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD}
    ports:
      - "127.0.0.1:${AUTHENTIK_HOST_PORT:-9100}:9000"
    volumes:
      - naruworks-authentik-data:/data
    depends_on:
      authentik-postgres:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.5
    container_name: naruworks-authentik-worker
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    volumes:
      - naruworks-authentik-data:/data
    depends_on:
      authentik-postgres:
        condition: service_healthy
      # 같은 볼륨을 두 컨테이너가 동시에 처음 만들면 /data/media 링크 생성이 충돌하므로 server 생성 이후에 시작한다.
      authentik-server:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: naruworks-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      - frontend

  rustfs-volume-permission:
    image: alpine:3.22
    container_name: naruworks-rustfs-volume-permission
    restart: "no"
    command: ["sh", "-ec", "chown -R 10001:10001 /data"]
    volumes:
      - naruworks-drive-data:/data

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: naruworks-rustfs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      rustfs-volume-permission:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${NARU_DRIVE_S3_ACCESS_KEY:?NARU_DRIVE_S3_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${NARU_DRIVE_S3_SECRET_KEY:?NARU_DRIVE_S3_SECRET_KEY is required}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - naruworks-drive-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rustfs-bucket-init:
    image: amazon/aws-cli:2.36.44
    container_name: naruworks-rustfs-bucket-init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${NARU_DRIVE_S3_ACCESS_KEY:?NARU_DRIVE_S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${NARU_DRIVE_S3_SECRET_KEY:?NARU_DRIVE_S3_SECRET_KEY is required}
      AWS_DEFAULT_REGION: us-east-1
      NARU_DRIVE_S3_BUCKET: ${NARU_DRIVE_S3_BUCKET:-naru-drive}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        endpoint=http://rustfs:9000
        if ! aws --endpoint-url "$${endpoint}" s3api head-bucket --bucket "$${NARU_DRIVE_S3_BUCKET}" >/dev/null 2>&1; then
          aws --endpoint-url "$${endpoint}" s3api create-bucket --bucket "$${NARU_DRIVE_S3_BUCKET}"
        fi

volumes:
  naruworks-postgres-data:
  naruworks-authentik-postgres-data:
  naruworks-authentik-data:
  naruworks-drive-data:
