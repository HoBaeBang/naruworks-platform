name: PR CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: naru_drive_test
          POSTGRES_USER: naru_test
          POSTGRES_PASSWORD: naru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naru_test -d naru_drive_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v5
      - name: Java 21 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Backend 테스트
        run: ./gradlew clean test
      - name: Drive PostgreSQL 통합 테스트
        env:
          NARU_DRIVE_POSTGRES_TEST: 'true'
          NARU_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/naru_drive_test
          NARU_TEST_DATABASE_USER: naru_test
          NARU_TEST_DATABASE_PASSWORD: naru_test
        run: ./gradlew :naru-api:test --tests com.naruworks.api.drive.DrivePostgresIntegrationTest --rerun-tasks

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v5
      - name: Node.js 준비
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: ESLint 검사
        run: npm run lint
      - name: Production build 검사
        run: npm run build
