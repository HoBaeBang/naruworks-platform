<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaruWorks ERD와 데이터 사전</title>
<style>
:root{--bg:#f8fbf8;--ink:#15201d;--muted:#587066;--mint:#20b977;--deep:#087a5f;--soft:#e1faf1;--line:#d8e7df;--card:#fff;--key:#a24b2f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif;line-height:1.55}main{width:min(100% - 32px,1240px);margin:auto;padding:42px 0 72px}a{color:var(--deep)}h1{font-size:clamp(2.2rem,6vw,4rem);margin:10px 0}.lead,.desc{color:var(--muted)}.ey{font-size:.75rem;font-weight:800;color:var(--deep);letter-spacing:.12em}.note{padding:15px 18px;background:var(--card);border-left:4px solid var(--mint);margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box,.spec{background:var(--card);border:1px solid var(--line);border-radius:7px}.box h3{margin:0;padding:10px 13px;background:var(--soft);color:var(--deep)}.box p{padding:0 13px;color:var(--muted);font-size:.86rem}.box ul{margin:0;padding:0 13px 12px;list-style:none;font:12px monospace}.box li{padding:3px 0;border-bottom:1px dotted var(--line)}.pk{color:var(--deep);font-weight:bold}.fk{color:var(--key);font-weight:bold}section{margin-top:52px}.spec{margin:20px 0;padding:18px;overflow:auto}.spec h2{margin:5px 0}.tags span{display:inline-block;padding:3px 7px;margin:2px;background:var(--soft);color:var(--deep);font-size:.75rem;font-weight:bold;border-radius:10px}table{width:100%;border-collapse:collapse;margin-top:14px;min-width:820px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--soft);color:var(--deep);font-size:.75rem}td{color:var(--muted)}td:first-child,td:nth-child(2){font-family:monospace;color:var(--ink)}@media(max-width:760px){.grid{grid-template-columns:1fr}main{width:min(100% - 24px,1240px)}}
</style>
</head>
<body><main>
<a href="index.html">← 설계 문서 홈</a><div class="ey" style="margin-top:28px">01 · DATA MODEL · V14</div><h1>ERD와 데이터 사전</h1>
<p class="lead">Flyway migration 기준 PostgreSQL 명세입니다. 관계는 <a href="erd-relations.md">Mermaid 관계 ERD</a>에서 확인합니다.</p>
<div class="note">현재 9개 테이블을 기록합니다. OAuth 연결은 <code>calendar_integrations</code>, 여러 Google 캘린더 선택과 향후 sync 지점은 <code>calendar_integration_calendars</code>로 분리합니다.</div>
<div id="cards" class="grid"></div><section><h2>상세 명세</h2><div id="specs"></div></section>
<script>
const C=(p,l,t,n,d,k,x)=>[p,l,t,n,d,k,x],T=(n,l,x,i,c)=>({n,l,x,i,c});
const data=[
T('projects','프로젝트 카탈로그','공개 프로젝트 목록',['PK id','UNIQUE slug'],[C('id','프로젝트 ID','BIGSERIAL','N','자동 증가','PK','내부 식별자'),C('slug','슬러그','VARCHAR(100)','N','-','UNIQUE','URL/API 식별자'),C('name','프로젝트명','VARCHAR(200)','N','-','-','표시 이름'),C('description','설명','TEXT','N','-','-','소개'),C('status','상태','VARCHAR(50)','N','-','-','진행 상태'),C('display_order','노출 순서','INTEGER','N','0','-','정렬'),C('created_at','생성 시각','TIMESTAMPTZ','N','now()','-','생성'),C('updated_at','수정 시각','TIMESTAMPTZ','N','now()','-','수정')]),
T('service_catalog_items','서비스 카탈로그','Naru Home 서비스 목록',['PK id','UNIQUE slug'],[C('id','서비스 ID','BIGSERIAL','N','자동 증가','PK','식별자'),C('slug','슬러그','VARCHAR(100)','N','-','UNIQUE','URL 식별자'),C('name','서비스명','VARCHAR(200)','N','-','-','표시명'),C('description','설명','TEXT','N','-','-','서비스 설명'),C('status','상태','VARCHAR(50)','N','-','-','준비 상태'),C('display_order','노출 순서','INTEGER','N','0','-','정렬'),C('created_at','생성 시각','TIMESTAMPTZ','N','now()','-','생성'),C('updated_at','수정 시각','TIMESTAMPTZ','N','now()','-','수정')]),
T('members','회원','Google 기반 회원·추천 관계',['PK id','UNIQUE(provider, provider_user_id)','UNIQUE referral_code','INDEX email/status/referrer'],[C('id','회원 ID','BIGSERIAL','N','자동 증가','PK','식별자'),C('email','이메일','VARCHAR(255)','N','-','INDEX','Google 이메일'),C('display_name','표시명','VARCHAR(100)','N','-','-','Google 이름'),C('profile_image_url','이미지 URL','VARCHAR(500)','Y','NULL','-','프로필 이미지'),C('provider','제공자','VARCHAR(30)','N','-','UNIQUE 복합','GOOGLE'),C('provider_user_id','제공자 ID','VARCHAR(255)','N','-','UNIQUE 복합','Google sub'),C('role','권한','VARCHAR(30)','N','-','-','USER/ADMIN'),C('status','회원 상태','VARCHAR(30)','N','-','INDEX','APPROVED 등'),C('referrer_member_id','추천인 ID','BIGINT','Y','NULL','FK / INDEX','members.id'),C('referral_code','추천 코드','VARCHAR(6)','N','-','UNIQUE','6자리 코드'),C('created_at','생성 시각','TIMESTAMP','N','-','-','생성'),C('approved_at','승인 시각','TIMESTAMP','Y','NULL','-','승인'),C('last_login_at','마지막 로그인','TIMESTAMP','N','-','-','로그인')]),
T('member_terms_agreements','약관 동의 이력','회원별 약관 버전 동의',['PK id','FK member_id','UNIQUE(member,type,version)'],[C('id','동의 ID','BIGSERIAL','N','자동 증가','PK','식별자'),C('member_id','회원 ID','BIGINT','N','-','FK / INDEX','members.id'),C('agreement_type','약관 유형','VARCHAR(30)','N','-','UNIQUE 복합','약관 종류'),C('agreement_version','약관 버전','VARCHAR(30)','N','-','UNIQUE 복합','문서 버전'),C('agreed_at','동의 시각','TIMESTAMP','N','-','-','동의 완료')]),
T('calendar_events','일정 원본','단일·반복 일정의 원본',['PK id','FK member_id','INDEX(member_id,start_at)'],[C('id','일정 ID','BIGSERIAL','N','자동 증가','PK','식별자'),C('member_id','소유 회원 ID','BIGINT','N','-','FK / INDEX','members.id'),C('title','제목','VARCHAR(100)','N','-','-','제목'),C('description','설명','TEXT','Y','NULL','-','설명'),C('start_at','시작','TIMESTAMP','N','-','INDEX 복합','시작 일시'),C('end_at','종료','TIMESTAMP','N','-','-','종료 일시'),C('all_day','종일','BOOLEAN','N','-','-','종일 여부'),C('location','장소','VARCHAR(255)','Y','NULL','-','장소'),C('color','색상','VARCHAR(20)','N','-','-','표시색'),C('recurrence_rule','반복 규칙','VARCHAR(30)','N','-','-','반복 유형'),C('recurrence_lunar_month','음력 월','INTEGER','Y','NULL','-','음력 연 반복'),C('recurrence_lunar_day','음력 일','INTEGER','Y','NULL','-','음력 연 반복'),C('recurrence_end_at','반복 종료','TIMESTAMP','Y','NULL','-','미정이면 계속'),C('status','상태','VARCHAR(30)','N','-','-','ACTIVE 등'),C('created_at','생성 시각','TIMESTAMP','N','CURRENT_TIMESTAMP','-','생성'),C('updated_at','수정 시각','TIMESTAMP','N','CURRENT_TIMESTAMP','-','수정')]),
T('calendar_event_exceptions','반복 회차 예외','특정 회차 취소·재정의',['PK id','FK event','UNIQUE(event,occurrence)'],[C('id','예외 ID','BIGSERIAL','N','자동 증가','PK','식별자'),C('calendar_event_id','원본 일정 ID','BIGINT','N','-','FK / INDEX','calendar_events.id'),C('occurrence_start_at','대상 회차','TIMESTAMP','N','-','UNIQUE 복합','원래 시작'),C('exception_type','예외 유형','VARCHAR(30)','N','-','-','CANCELLED/OVERRIDDEN'),C('title','재정의 제목','VARCHAR(100)','Y','NULL','-','선택값'),C('description','재정의 설명','TEXT','Y','NULL','-','선택값'),C('start_at','재정의 시작','TIMESTAMP','Y','NULL','-','선택값'),C('end_at','재정의 종료','TIMESTAMP','Y','NULL','-','선택값'),C('all_day','재정의 종일','BOOLEAN','Y','NULL','-','선택값'),C('location','재정의 장소','VARCHAR(255)','Y','NULL','-','선택값'),C('color','재정의 색상','VARCHAR(20)','Y','NULL','-','선택값'),C('created_at','생성 시각','TIMESTAMP','N','CURRENT_TIMESTAMP','-','생성'),C('updated_at','수정 시각','TIMESTAMP','N','CURRENT_TIMESTAMP','-','수정')]),
T('calendar_holiday_overrides','공휴일 운영 예외','법정 공휴일 결과 ADD/REMOVE',['PK id','UNIQUE holiday_date','CHECK operation/name'],[C('id','예외 ID','BIGSERIAL','N','자동 증가','PK','식별자'),C('holiday_date','대상 날짜','DATE','N','-','UNIQUE','적용 날짜'),C('operation','작업','VARCHAR(10)','N','-','CHECK','ADD/REMOVE'),C('holiday_name','공휴일명','VARCHAR(100)','Y','NULL','CHECK','ADD일 때 필수'),C('reason','사유','VARCHAR(255)','Y','NULL','-','운영 메모'),C('created_at','생성 시각','TIMESTAMP','N','CURRENT_TIMESTAMP','-','생성'),C('updated_at','수정 시각','TIMESTAMP','N','CURRENT_TIMESTAMP','-','수정')]),
T('calendar_integrations','외부 Calendar 연결','회원별 Google OAuth 연결',['PK id','FK member','UNIQUE(member,provider)'],[C('id','연결 ID','BIGSERIAL','N','자동 증가','PK','식별자'),C('member_id','소유 회원 ID','BIGINT','N','-','FK / UNIQUE 복합','members.id'),C('provider','제공자','VARCHAR(30)','N','-','CHECK','GOOGLE'),C('provider_account_id','계정 ID','VARCHAR(255)','N','-','-','Google sub'),C('provider_email','계정 이메일','VARCHAR(320)','N','-','-','연결 이메일'),C('encrypted_refresh_token','암호화 token','TEXT','N','-','-','AES-GCM 암호문'),C('status','연결 상태','VARCHAR(30)','N','-','CHECK','CONNECTED 등'),C('created_at','생성 시각','TIMESTAMP','N','-','-','생성'),C('updated_at','수정 시각','TIMESTAMP','N','-','-','수정')]),
T('calendar_integration_calendars','외부 캘린더 선택','Google 캘린더별 선택·동기화 지점',['PK id','FK integration','UNIQUE(integration,calendar)','INDEX integration'],[C('id','선택 ID','BIGSERIAL','N','자동 증가','PK','식별자'),C('calendar_integration_id','OAuth 연결 ID','BIGINT','N','-','FK / INDEX','calendar_integrations.id'),C('provider_calendar_id','Google 캘린더 ID','VARCHAR(500)','N','-','UNIQUE 복합','Google calendarId'),C('calendar_name','캘린더명','VARCHAR(255)','N','-','-','Google 표시명'),C('calendar_color','캘린더 색상','VARCHAR(20)','Y','NULL','-','Google 색상'),C('enabled','표시 선택','BOOLEAN','N','FALSE','-','Naru 화면 표시 여부'),C('last_synced_at','마지막 동기화','TIMESTAMP','Y','NULL','-','향후 Events 조회 시각'),C('sync_token','증분 token','TEXT','Y','NULL','-','향후 변경 조회 token'),C('created_at','생성 시각','TIMESTAMP','N','CURRENT_TIMESTAMP','-','생성'),C('updated_at','수정 시각','TIMESTAMP','N','CURRENT_TIMESTAMP','-','수정')])
];
const cards=document.querySelector('#cards'),specs=document.querySelector('#specs');
cards.innerHTML=data.map(t=>'<article class="box"><h3>'+t.n+'</h3><p>'+t.x+'</p><ul>'+t.i.map(i=>'<li>'+i+'</li>').join('')+'</ul></article>').join('');
specs.innerHTML=data.map(t=>'<article class="spec"><div class="tags">'+t.i.map(i=>'<span>'+i+'</span>').join('')+'</div><h2>'+t.l+' · <code>'+t.n+'</code></h2><p class="desc">'+t.x+'</p><table><thead><tr><th>물리명</th><th>논리명</th><th>타입</th><th>NULL</th><th>기본값</th><th>키/인덱스</th><th>설명</th></tr></thead><tbody>'+t.c.map(c=>'<tr>'+c.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></article>').join('');
</script></main></body></html>
