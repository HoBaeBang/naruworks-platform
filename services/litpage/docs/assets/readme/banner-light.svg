  <!-- AI chip -->
  <g transform="translate(1318 318)" filter="url(#shadow)">
    <rect width="222" height="52" rx="26" fill="#4f46e5"/>
    <path d="M30 14l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#ffffff"/>
    <text x="54" y="33" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Ask Litpage AI</text>
