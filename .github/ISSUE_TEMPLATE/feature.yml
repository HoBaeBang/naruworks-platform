name: 기능 작업
description: 작은 기능 또는 개선 작업을 정의합니다.
title: "[기능] "
labels: ["type:feature"]
assignees: ["HoBaeBang"]
body:
  - type: markdown
    attributes:
      value: |
        한 이슈는 리뷰 가능한 작은 변경 단위로 유지합니다.
        작업 방식은 호배님이 `학습형` 또는 `구현형`으로 선택합니다.
  - type: dropdown
    id: work-mode
    attributes:
      label: 작업 방식
      options:
        - 학습형 - 구현 가이드를 받고 직접 작성한 뒤 리뷰받기
        - 구현형 - Codex가 구현하고 PR에서 검토하기
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: 기능 영역
      description: 작업의 주된 영역을 선택합니다. 이슈 생성 뒤 같은 이름의 domain 라벨도 붙입니다.
      options:
        - platform - 홈, 공통 UI, 회원 메뉴, 프로젝트 운영
        - calendar - Naru Calendar와 공유 일정
        - auth - 인증, 회원, 권한, 초대
        - drive - Naru Drive
        - docs - Naru Docs, Sheets, Slides
        - infra - Docker, Cloudflare, 홈서버, 배포
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 배경과 문제
      description: 왜 이 작업이 필요한지, 현재 어떤 불편 또는 위험이 있는지 작성합니다.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표와 완료 조건
      description: 사용자가 실제로 할 수 있어야 하는 동작과 확인 가능한 완료 조건을 작성합니다.
      placeholder: |
        - [ ] 사용자는 ...할 수 있다.
        - [ ] ... 상황에서 ...을 반환한다.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 구현 설계
      description: 변경할 모듈, API, DB, 화면, 테스트 전략과 제외 범위를 작성합니다. 학습형은 구현 전에 가이드로 보완합니다.
  - type: textarea
    id: verification
    attributes:
      label: 검증 시나리오
      description: 자동 테스트와 브라우저 또는 API에서 직접 확인할 흐름을 작성합니다.
    validations:
      required: true
