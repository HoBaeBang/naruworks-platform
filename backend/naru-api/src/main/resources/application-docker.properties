spring.application.name=naru-api
server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:naruworks_local}
spring.datasource.username=${POSTGRES_USER:naruworks_local}
spring.datasource.password=${POSTGRES_PASSWORD:change_me_local_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.client.registration.idp.client-id=${IDP_CLIENT_ID:naru-api}
spring.security.oauth2.client.registration.idp.client-secret=${IDP_CLIENT_SECRET}
spring.security.oauth2.client.registration.idp.scope=openid,email,profile
spring.security.oauth2.client.registration.idp.redirect-uri=${IDP_LOGIN_REDIRECT_URI:https://api.naruworks.com/login/oauth2/code/idp}
spring.security.oauth2.client.provider.idp.issuer-uri=${IDP_ISSUER_URI:https://idp.naruworks.com/realms/naruworks}

naru.frontend-base-url=https://app.naruworks.com
naru.google-calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
naru.google-calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
naru.google-calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:https://api.naruworks.com/api/calendar/integrations/google/callback}
naru.google-calendar.token-encryption-key=${GOOGLE_CALENDAR_TOKEN_ENCRYPTION_KEY:}

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
