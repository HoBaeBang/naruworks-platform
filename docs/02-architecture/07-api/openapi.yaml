                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["CATEGORY_NOT_FOUND"]
        "500": {"$ref":"#/components/responses/InternalError"}
    delete:
      tags: ["Admin"]
      operationId: "deleteCategory"
      summary: "배정된 서비스가 없는 카테고리 삭제"
      description: |-
        숨긴 오픈소스를 포함해 배정된 서비스가 하나라도 있으면 삭제를 막고 카테고리를 유지한다. UI는 차단 안내 대화상자를 표시한다(DEC-115).

        근거 ID · FR-ADM-004. AC-FR-ADM-004-03, AC-FR-ADM-004-04.
      security:
        -
          sessionCookie: []
          csrfHeader: []
      parameters:
        - {"$ref":"#/components/parameters/CategoryId"}
      responses:
        "204":
          description: "완료. 응답 본문 없음."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
        "400": {"$ref":"#/components/responses/InvalidRequest"}
        "401": {"$ref":"#/components/responses/SessionRequired"}
        "403":
          description: "CSRF_REJECTED — 요청의 CSRF 검증 실패. ADMIN_REQUIRED — 관리자 권한이 필요함."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["CSRF_REJECTED","ADMIN_REQUIRED"]
        "404":
          description: "CATEGORY_NOT_FOUND — 카테고리를 찾을 수 없음."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["CATEGORY_NOT_FOUND"]
        "409":
          description: "CATEGORY_HAS_SERVICES — 서비스가 배정된 카테고리는 삭제할 수 없음."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["CATEGORY_HAS_SERVICES"]
        "500": {"$ref":"#/components/responses/InternalError"}
  "/admin/services/{serviceId}/category":
    put:
      tags: ["Admin"]
      operationId: "assignServiceCategory"
      summary: "서비스의 카테고리 배정 변경"
      description: |-
        서비스당 카테고리는 하나다. 변경을 홈·헤더에 반영하고 숨긴 서비스는 계속 숨긴다(DEC-120).

        근거 ID · FR-ADM-004, FR-HOME-002, FR-SHELL-001. AC-FR-ADM-004-01, AC-FR-ADM-004-02, AC-FR-HOME-002-01, AC-FR-HOME-002-02, AC-FR-SHELL-001-03.
      security:
        -
          sessionCookie: []
          csrfHeader: []
      parameters:
        - {"$ref":"#/components/parameters/ServiceId"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/CategoryAssignment"}
      responses:
        "200":
          description: "조회 또는 변경 완료."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Service"}
        "400": {"$ref":"#/components/responses/InvalidRequest"}
        "401": {"$ref":"#/components/responses/SessionRequired"}
        "403":
          description: "CSRF_REJECTED — 요청의 CSRF 검증 실패. ADMIN_REQUIRED — 관리자 권한이 필요함."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["CSRF_REJECTED","ADMIN_REQUIRED"]
        "404":
          description: "SERVICE_NOT_FOUND — 서비스를 찾을 수 없음. CATEGORY_NOT_FOUND — 카테고리를 찾을 수 없음."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["SERVICE_NOT_FOUND","CATEGORY_NOT_FOUND"]
        "500": {"$ref":"#/components/responses/InternalError"}
  "/.well-known/openid-configuration":
    servers:
      - {url: "/", description: "나루 OP issuer 오리진. 호스트 [미확인]."}
    get:
      tags: ["OIDC"]
      operationId: "getOidcDiscovery"
      summary: "나루 OP 메타데이터 조회"
      security: []
      responses:
        "200":
          description: "issuer는 실행 환경의 HTTPS 오리진이다. 엔드포인트는 절대 HTTPS URL이다."
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/OidcDiscovery"}
  "/oidc/authorize":
    servers:
      - {url: "/", description: "나루 OP. 호스트 [미확인]."}
    get:
      tags: ["OIDC"]
      operationId: "authorizeOidc"
      summary: "Litpage RP에 인가 코드 발급"
      description: "정적 등록 client와 redirect_uri를 검증한다. 나루 세션이 없으면 검증된 인가 요청을 서버에 바인딩하고 Google 로그인 후 재개한다. 정지·탈퇴 및 신규 진입 조건 위반은 access_denied로 처리한다. 인가 요청 자체의 검증에 실패하고 등록 복귀 주소를 확인할 수 없으면 브라우저에서 오류를 표시한다. 등록한 Litpage RP의 권한 범위는 openid로 한정한다."
      security:
        - {}
        - {sessionCookie: []}
      parameters:
        - {name: "response_type", in: "query", required: true, schema: {const: "code"}}
        - {name: "client_id", in: "query", required: true, schema: {type: "string", minLength: 1}}
        - {name: "redirect_uri", in: "query", required: true, schema: {type: "string", format: "uri"}}
        - {name: "scope", in: "query", required: true, schema: {const: "openid"}}
        - {name: "state", in: "query", required: true, schema: {type: "string", minLength: 1}}
        - {name: "nonce", in: "query", required: true, schema: {type: "string", minLength: 1}}
        - {name: "code_challenge", in: "query", required: true, schema: {type: "string", pattern: '^[A-Za-z0-9_-]{43}$'}}
        - {name: "code_challenge_method", in: "query", required: true, schema: {const: "S256"}}
      responses:
        "302": {"$ref":"#/components/responses/OidcAuthorizationRedirect"}
        "400":
          description: "잘못된 요청. 검증되지 않은 주소로 이동하지 않는다."
          headers:
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
    post:
      tags: ["OIDC"]
      operationId: "authorizeOidcForm"
      summary: "폼으로 Litpage RP 인가 요청"
      description: "GET과 같은 판정 및 복귀 계약이다. 로그인이나 사용자 상호작용이 필요하면 303으로 나루 화면으로 이동한다."
      security:
        - {}
        - {sessionCookie: []}
      requestBody:
        required: true
        content:
          "application/x-www-form-urlencoded":
            schema:
              type: "object"
              required: ["response_type", "client_id", "redirect_uri", "scope", "state", "nonce", "code_challenge", "code_challenge_method"]
              properties:
                response_type: {const: "code"}
                client_id: {type: "string", minLength: 1}
                redirect_uri: {type: "string", format: "uri"}
                scope: {const: "openid"}
                state: {type: "string", minLength: 1}
                nonce: {type: "string", minLength: 1}
                code_challenge: {type: "string", pattern: '^[A-Za-z0-9_-]{43}$'}
                code_challenge_method: {const: "S256"}
      responses:
        "303": {"$ref":"#/components/responses/OidcAuthorizationRedirect"}
        "400":
          description: "잘못된 요청. 검증되지 않은 주소로 이동하지 않는다."
          headers:
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
  "/oidc/token":
    servers:
      - {url: "/", description: "나루 OP. 호스트 [미확인]."}
    post:
      tags: ["OIDC"]
      operationId: "issueOidcToken"
      summary: "인가 코드 교환 또는 리프레시 토큰 회전"
      description: "TLS 연결에서 client_secret_basic을 검증한다. 코드 교환은 등록 redirect_uri와 PKCE verifier 및 일회용 코드를 검사한다. 두 grant 모두 유효한 연결 세션과 최신 회원 상태가 필요하다. 인증·검증 결과와 응답 자격 원문은 로그에 남기지 않는다."
      security:
        - {oidcClientBasic: []}
      requestBody:
        required: true
        content:
          "application/x-www-form-urlencoded":
            schema:
              oneOf:
                - type: "object"
                  required: ["grant_type", "code", "redirect_uri", "code_verifier"]
                  properties:
                    grant_type: {const: "authorization_code"}
                    code: {type: "string", minLength: 1}
                    redirect_uri: {type: "string", format: "uri"}
                    code_verifier: {type: "string", pattern: '^[A-Za-z0-9._~-]{43,128}$'}
                - type: "object"
                  required: ["grant_type", "refresh_token"]
                  properties:
                    grant_type: {const: "refresh_token"}
                    refresh_token: {type: "string", minLength: 1}
      responses:
        "200":
          description: "액세스·리프레시 토큰 발급. id_token은 최초 코드 교환에서 필수이고 갱신에서는 생략한다. 수명은 원본 나루 세션의 유휴·절대 만료를 넘지 않는다."
          headers:
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
            Pragma: {required: true, schema: {const: "no-cache"}}
          content:
            "application/json":
              schema:
                type: "object"
                required: ["access_token", "token_type", "expires_in", "refresh_token"]
                properties:
                  access_token: {type: "string", minLength: 1}
                  token_type: {const: "Bearer"}
                  expires_in: {type: "integer", minimum: 1, maximum: 300, description: "액세스 토큰의 유효기간(초)."}
                  id_token: {type: "string", minLength: 1}
                  refresh_token: {type: "string", minLength: 1}
        "400":
          description: "유효하지 않은 요청 또는 grant. 세션의 폐기·만료, 정지·탈퇴 회원은 invalid_grant로 응답한다."
          headers:
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/OidcError"}
        "401":
          description: "invalid_client. Basic 클라이언트 인증 실패."
          headers:
            WWW-Authenticate: {required: true, schema: {type: "string"}}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/OidcError"}
  "/oidc/jwks":
    servers:
      - {url: "/", description: "나루 OP. 호스트 [미확인]."}
    get:
      tags: ["OIDC"]
      operationId: "getOidcJwks"
      summary: "OP 서명 키의 공개 JWK 조회"
      security: []
      responses:
        "200":
          description: "활성 공개 키와 정상 회전 중 검증 유예 공개 키. 교체할 새 공개 키를 활성화 전에 게시할 수 있다."
          content:
            "application/json":
              schema:
                type: "object"
                required: ["keys"]
                properties:
                  keys:
                    type: "array"
                    items:
                      type: "object"
                      additionalProperties: false
                      required: ["kid", "kty", "use", "alg", "n", "e"]
                      properties:
                        kid: {type: "string"}
                        kty: {const: "RSA"}
                        use: {const: "sig"}
                        alg: {const: "RS256"}
                        n: {type: "string", description: "RSA 공개 모듈러스"}
                        e: {type: "string", description: "RSA 공개 지수"}
  "/oidc/userinfo":
    servers:
      - {url: "/", description: "나루 OP. 호스트 [미확인]."}
    get:
      tags: ["OIDC"]
      operationId: "getOidcUserInfo"
      summary: "액세스 토큰의 주체 확인"
      description: "UserInfo 전용 토큰과 나루 세션을 검사하고 정지·탈퇴 여부를 조회한다. Litpage RP는 이 주체를 ID 토큰 또는 기존 RP 세션의 주체와 대조한다."
      security:
        - {oidcUserInfoBearer: []}
      responses:
        "200": {"$ref":"#/components/responses/OidcUserInfoSubject"}
        "401": {"$ref":"#/components/responses/OidcUserInfoUnauthorized"}
    post:
      tags: ["OIDC"]
      operationId: "postOidcUserInfo"
      summary: "액세스 토큰의 주체 확인"
      security:
        - {oidcUserInfoBearer: []}
      responses:
        "200": {"$ref":"#/components/responses/OidcUserInfoSubject"}
        "401": {"$ref":"#/components/responses/OidcUserInfoUnauthorized"}
  "/oidc/end-session":
    servers:
      - {url: "/", description: "나루 OP. 호스트 [미확인]."}
    get:
      tags: ["OIDC"]
      operationId: "startOidcEndSession"
      summary: "RP 시작 로그아웃 확인 요청"
      description: "등록된 client_id·post_logout_redirect_uri를 대조하고 logout_hint의 sid를 현재 나루 세션과 확인한다. 이미 종료됐거나 현재 세션과 다르면 현재 세션을 유지하고 검증된 복귀 경로로 이동한다."
      security:
        - {}
        - {sessionCookie: []}
      parameters:
        - {name: "client_id", in: "query", required: true, schema: {type: "string", minLength: 1}}
        - {name: "logout_hint", in: "query", required: true, schema: {type: "string", description: "RP가 받은 현재 sid. 인증 자격으로 사용하지 않는다."}}
        - {name: "post_logout_redirect_uri", in: "query", required: true, schema: {type: "string", format: "uri"}}
        - {name: "state", in: "query", required: true, schema: {type: "string", minLength: 1}}
      responses:
        "200":
          description: "현재 기기 로그아웃 확인 화면과 일회용 폼을 제공한다."
          headers:
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "text/html":
              schema: {type: "string"}
        "303": {"$ref":"#/components/responses/OidcEndSessionRedirect"}
        "400":
          description: "유효하지 않은 로그아웃 요청. 검증되지 않은 복귀 경로로 이동하지 않는다."
    post:
      tags: ["OIDC"]
      operationId: "postOidcEndSession"
      summary: "RP 로그아웃 시작 또는 나루 확인 폼 제출"
      description: "RP의 시작 POST는 GET과 동일한 필드를 받으며 즉시 세션을 변경하지 않는다. 확인 POST는 일회용 시도와 나루 세션에 바인딩된 동일 오리진 CSRF를 검증한다. sid가 일치한 현재 세션만 폐기하고 백채널 전파를 등록한다."
      security:
        - {}
        - {sessionCookie: []}
      requestBody:
        required: true
        content:
          "application/x-www-form-urlencoded":
            schema:
              oneOf:
                - type: "object"
                  required: ["client_id", "logout_hint", "post_logout_redirect_uri", "state"]
                  properties:
                    client_id: {type: "string", minLength: 1}
                    logout_hint: {type: "string", minLength: 1}
                    post_logout_redirect_uri: {type: "string", format: "uri"}
                    state: {type: "string", minLength: 1}
                - type: "object"
                  required: ["logout_attempt", "csrf_token"]
                  properties:
                    logout_attempt: {type: "string", minLength: 1}
                    csrf_token: {type: "string", minLength: 1}
      responses:
        "200":
          description: "로그아웃 시작 요청의 확인 화면."
          headers:
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "text/html":
              schema: {type: "string"}
        "303": {"$ref":"#/components/responses/OidcEndSessionRedirect"}
        "400":
          description: "유효하지 않은 종료 요청 또는 확인 폼."
        "403":
          description: "현재 세션의 로그아웃 확인 CSRF 검증 실패."
  "/oidc/backchannel-logout":
    servers:
      - url: "https://{litpageHost}"
        description: "별도 Litpage RP 오리진. 배포 호스트 [미확인]."
        variables:
          litpageHost:
            default: "litpage.invalid"
            description: "예시용 예약 호스트. 정적 등록의 실제 호스트는 [미확인]."
    post:
      tags: ["OIDC"]
      operationId: "receiveLitpageBackchannelLogout"
      summary: "Litpage RP가 OP의 로그아웃 통지를 수신"
      description: "RS256 Logout Token과 등록 issuer·audience·sid·iat·exp·jti·events 및 nonce 부재를 검증한다. 현재 sid의 세션과 웹소켓만 종료한다. 브라우저 자격은 요구하지 않는다."
      security: []
      requestBody:
        required: true
        content:
          "application/x-www-form-urlencoded":
            schema:
              type: "object"
              required: ["logout_token"]
              properties:
                logout_token: {type: "string", minLength: 1}
      responses:
        "200":
          description: "대상 sid의 세션 종료. 이미 종료한 sid에 대한 유효한 중복 통지도 성공이다."
          headers:
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
        "400":
          description: "유효하지 않은 통지 또는 RP 처리 실패."
          headers:
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
components:
  securitySchemes:
    oidcClientBasic:
      type: "http"
      scheme: "basic"
      description: "등록한 기밀 RP의 client_secret_basic"
    oidcUserInfoBearer:
      type: "http"
      scheme: "bearer"
      description: "나루 OP에서 발급한 UserInfo 전용 불투명 액세스 토큰"
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "naru_session"
      description: "나루 PostgreSQL에서 검증하는 현재 브라우저의 세션 쿠키. 09에 따라 Secure·HttpOnly·SameSite=Lax 및 Path=/, Domain·Expires 생략, 절대 만료까지 남은 Max-Age를 적용한다."
    csrfHeader:
      type: "apiKey"
      in: "header"
      name: "X-CSRF-Token"
      description: "쿠키 인증 쓰기와 Litpage 진입에서 세션 쿠키와 함께 검증하는 CSRF 값. 세션 조회 응답으로 전달하고 로그인·갱신 때 회전한다."
  parameters:
    Cursor:
      name: "cursor"
      in: "query"
      description: "같은 조회 조건으로 다음 페이지를 요청하는 불투명 커서. 첫 요청에서 생략한다."
      schema:
        type: "string"
        minLength: 1
    Limit:
      name: "limit"
      in: "query"
      description: "요청 페이지 크기. 09 제안은 기본 50, 최대 100이다."
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
    ReturnTo:
      name: "returnTo"
      in: "query"
      description: "인증 후 복귀할 나루 내부 화면 또는 링크 보기 주소. 서버가 허용된 동일 오리진 상대 경로만 저장한다."
      schema:
        type: "string"
        format: "uri-reference"
    GoogleCode:
      name: "code"
      in: "query"
      description: "Google 인증 성공 시 반환되는 코드."
      schema:
        type: "string"
    GoogleState:
      name: "state"
      in: "query"
      required: true
      description: "로그인 시작 흐름과 콜백을 연결하는 검증 값."
      schema:
        type: "string"
    GoogleError:
      name: "error"
      in: "query"
      description: "Google 인증 실패·취소인 경우 전달되는 오류 분류. 공개 응답에 복사하지 않는다."
      schema:
        type: "string"
    Document:
      name: "document"
      in: "path"
      required: true
      description: "공개 문서 종류."
      schema:
        type: "string"
        enum: ["terms","privacy","licenses"]
    Language:
      name: "language"
      in: "query"
      description: "문서 언어. 생략 시 화면 언어 전달 또는 기본 언어 선택은 [미확인]."
      schema: {"$ref":"#/components/schemas/Language"}
    FolderQuery:
      name: "folderId"
      in: "query"
      description: "조회할 상위 폴더. 소유 목록에서 생략하면 루트."
      schema:
        type: "string"
        description: "서비스가 발급한 불투명 식별자."
        minLength: 1
    DriveScope:
      name: "scope"
      in: "query"
      description: "소유 항목 또는 받은 공유 파일."
      schema:
        type: "string"
        enum: ["owned","shared"]
        default: "owned"
    BaseRevision:
      name: "baseRevision"
      in: "query"
      required: true
      description: "편집을 시작한 원본 버전."
      schema:
        type: "string"
        description: "파일 버전을 식별하는 불투명한 값."
        minLength: 1
    ResultId:
      name: "resultId"
      in: "path"
      required: true
      description: "대상 식별자."
      schema:
        type: "string"
        description: "서비스가 발급한 불투명 식별자."
        minLength: 1
    FolderId:
      name: "folderId"
      in: "path"
      required: true
      description: "대상 식별자."
      schema:
        type: "string"
        description: "서비스가 발급한 불투명 식별자."
        minLength: 1
    ItemId:
      name: "itemId"
      in: "path"
      required: true
      description: "대상 식별자."
      schema:
        type: "string"
        description: "서비스가 발급한 불투명 식별자."
        minLength: 1
    FileId:
      name: "fileId"
      in: "path"
      required: true
      description: "대상 식별자."
      schema:
        type: "string"
        description: "서비스가 발급한 불투명 식별자."
        minLength: 1
    MemberId:
      name: "memberId"
      in: "path"
      required: true
      description: "대상 식별자."
      schema:
        type: "string"
        description: "서비스가 발급한 불투명 식별자."
        minLength: 1
    ServiceId:
      name: "serviceId"
      in: "path"
      required: true
      description: "대상 식별자."
      schema:
        type: "string"
        description: "서비스가 발급한 불투명 식별자."
        minLength: 1
    CategoryId:
      name: "categoryId"
      in: "path"
      required: true
      description: "대상 식별자."
      schema:
        type: "string"
        description: "서비스가 발급한 불투명 식별자."
        minLength: 1
    LinkKey:
      name: "linkKey"
      in: "path"
      required: true
      description: "공유 주소의 불투명한 키. URL과 요청 로그에서 키를 보호한다."
      schema:
        type: "string"
        minLength: 1
  headers:
    RequestId:
      description: "응답 본문의 requestId와 같은 상관 ID. 무본문 응답에서도 쓸 수 있다."
      schema:
        type: "string"
        minLength: 1
    NoStore:
      description: "세션·개인 데이터 또는 공개 링크 결과를 재사용 가능한 캐시에 남기지 않는다."
      schema:
        const: "no-store"
        type: "string"
    Location:
      description: "서버가 지정한 이동 주소."
      schema:
        type: "string"
        format: "uri-reference"
    SessionCookie:
      description: "나루 세션 쿠키 발급·갱신 또는 제거. 속성과 발급 조건은 07 개요와 09 참조."
      schema:
        type: "string"
    Attachment:
      description: "원본 파일을 첨부로 제공한다."
      schema:
        type: "string"
    Revision:
      description: "편집을 시작한 파일 상태를 나타내는 버전."
      schema:
        type: "string"
        description: "파일 버전을 식별하는 불투명한 값."
        minLength: 1
    CsrfToken:
      description: "인증된 같은 오리진 화면에서 변경·진입 요청에 사용할 현재 CSRF 값. 발급·회전은 09를 따른다."
      schema:
        type: "string"
        minLength: 1
  responses:
    OidcAuthorizationRedirect:
      description: "나루 로그인 화면으로 이동하거나, 검증된 RP 콜백에 code 또는 OAuth error와 원래 state를 반환한다."
      headers:
        Location: {required: true, schema: {type: "string"}}
        Cache-Control: {"$ref":"#/components/headers/NoStore"}
    OidcUserInfoSubject:
      description: "등록 RP에 반환하는 안정적인 로그인 주체."
      headers:
        Cache-Control: {"$ref":"#/components/headers/NoStore"}
      content:
        "application/json":
          schema:
            type: "object"
            required: ["sub"]
            properties:
              sub: {type: "string", minLength: 1}
    OidcUserInfoUnauthorized:
      description: "Bearer 인증 필요. 잘못되었거나 폐기된 토큰 및 정지·탈퇴 회원의 토큰은 invalid_token."
      headers:
        WWW-Authenticate: {required: true, schema: {type: "string"}}
        Cache-Control: {"$ref":"#/components/headers/NoStore"}
    OidcEndSessionRedirect:
      description: "OP 자체 확인 화면 또는 정확히 등록된 복귀 URI로 이동한다. RP 복귀 시 state를 반환한다. 폐기 완료 시 나루 쿠키를 제거한다."
      headers:
        Location: {required: true, schema: {type: "string"}}
        Cache-Control: {"$ref":"#/components/headers/NoStore"}
        Set-Cookie: {"$ref":"#/components/headers/SessionCookie"}
    SessionRequired:
      description: "AUTH_REQUIRED — 로그인이 필요함. SESSION_EXPIRED — 세션이 만료되어 다시 로그인해야 함."
      headers:
        X-Request-Id: {"$ref":"#/components/headers/RequestId"}
        Cache-Control: {"$ref":"#/components/headers/NoStore"}
      content:
        "application/json":
          schema:
            allOf:
              - {"$ref":"#/components/schemas/Error"}
              -
                properties:
                  code:
                    enum: ["AUTH_REQUIRED","SESSION_EXPIRED"]
    InvalidRequest:
      description: "INVALID_REQUEST — 요청의 경로·쿼리·본문 형식이 유효하지 않음."
      headers:
        X-Request-Id: {"$ref":"#/components/headers/RequestId"}
        Cache-Control: {"$ref":"#/components/headers/NoStore"}
      content:
        "application/json":
          schema:
            allOf:
              - {"$ref":"#/components/schemas/Error"}
              -
                properties:
                  code:
                    enum: ["INVALID_REQUEST"]
    InternalError:
      description: "INTERNAL_ERROR — 요청을 처리하지 못함."
      headers:
        X-Request-Id: {"$ref":"#/components/headers/RequestId"}
        Cache-Control: {"$ref":"#/components/headers/NoStore"}
      content:
        "application/json":
          schema:
            allOf:
              - {"$ref":"#/components/schemas/Error"}
              -
                properties:
                  code:
                    enum: ["INTERNAL_ERROR"]
  schemas:
    OidcDiscovery:
      type: "object"
      required:
        - "issuer"
        - "authorization_endpoint"
        - "token_endpoint"
        - "jwks_uri"
        - "userinfo_endpoint"
        - "end_session_endpoint"
        - "scopes_supported"
        - "response_types_supported"
        - "response_modes_supported"
        - "subject_types_supported"
        - "grant_types_supported"
        - "id_token_signing_alg_values_supported"
        - "token_endpoint_auth_methods_supported"
        - "code_challenge_methods_supported"
        - "request_uri_parameter_supported"
        - "backchannel_logout_supported"
        - "backchannel_logout_session_supported"
      properties:
        issuer: {type: "string", format: "uri"}
        authorization_endpoint: {type: "string", format: "uri"}
        token_endpoint: {type: "string", format: "uri"}
        jwks_uri: {type: "string", format: "uri"}
        userinfo_endpoint: {type: "string", format: "uri"}
        end_session_endpoint: {type: "string", format: "uri"}
        scopes_supported: {const: ["openid"]}
        response_types_supported: {const: ["code"]}
        response_modes_supported: {const: ["query"]}
        subject_types_supported: {const: ["public"]}
        grant_types_supported: {const: ["authorization_code", "refresh_token"]}
        id_token_signing_alg_values_supported: {const: ["RS256"]}
        token_endpoint_auth_methods_supported: {const: ["client_secret_basic"]}
        code_challenge_methods_supported: {const: ["S256"]}
        request_uri_parameter_supported: {const: false}
        backchannel_logout_supported: {const: true}
        backchannel_logout_session_supported: {const: true}
    OidcError:
      type: "object"
      required: ["error"]
      properties:
        error: {type: "string"}
        error_description: {type: "string"}
    Error:
      type: "object"
      additionalProperties: false
      required: ["code","message","requestId"]
      properties:
        code:
          type: "string"
          description: "클라이언트가 분기할 수 있는 오류 코드."
          pattern: "^[A-Z][A-Z0-9_]*$"
        message:
          type: "string"
          description: "사용자에게 공개할 수 있는 안내."
          minLength: 1
        requestId:
          type: "string"
          description: "요청과 운영 로그를 연결하는 불투명한 값."
          minLength: 1
    Binary:
      type: "string"
      description: "본문의 바이너리 바이트."
      format: "binary"
    Text:
      type: "string"
    Language:
      type: "string"
      enum: ["ko","en"]
    Theme:
      type: "string"
      enum: ["system","light","dark"]
    Session:
      type: "object"
      additionalProperties: false
      required: ["isAdmin","dataRestored"]
      properties:
        isAdmin:
          type: "boolean"
        dataRestored:
          type: "boolean"
          description: "이번 로그인에서 보관 데이터가 복구된 경우 true."
    Profile:
      type: "object"
      additionalProperties: false
      required: ["googleName","googleEmail","photoUrl","displayName","effectiveDisplayName","language","theme","driveUsageBytes"]
      properties:
        googleName:
          type: "string"
        googleEmail:
          type: "string"
          format: "email"
        photoUrl:
          type: ["string","null"]
          format: "uri"
        displayName:
          type: ["string","null"]
        effectiveDisplayName:
          type: "string"
        language:
          type: ["string","null"]
          enum: ["ko","en",null]
          description: "미설정 null이면 기기 언어를 적용한다."
        theme: {"$ref":"#/components/schemas/Theme"}
        driveUsageBytes:
          type: "integer"
          minimum: 0
    ProfileUpdate:
      type: "object"
      additionalProperties: false
      properties:
        displayName:
          type: "string"
          description: "한글 2점, 영문·숫자 1점의 합이 2~20. 한글·영문·숫자만 허용한다."
          minLength: 1
        language: {"$ref":"#/components/schemas/Language"}
        theme: {"$ref":"#/components/schemas/Theme"}
      minProperties: 1
    Category:
      type: "object"
      additionalProperties: false
      required: ["id","name"]
      properties:
        id:
          type: "string"
          description: "서비스가 발급한 불투명 식별자."
          minLength: 1
        name:
          type: "string"
          minLength: 1
    Service:
      type: "object"
      additionalProperties: false
      required: ["id","name","kind","categoryId"]
      properties:
        id:
          type: "string"
          description: "서비스가 발급한 불투명 식별자."
          minLength: 1
        name:
          type: "string"
          minLength: 1
        kind:
          type: "string"
          enum: ["drive","openSource"]
        categoryId:
          type: "string"
          description: "서비스가 발급한 불투명 식별자."
          minLength: 1
    LitpageEntry:
      oneOf:
        -
          type: "object"
          additionalProperties: false
          required: ["state"]
          properties:
            state:
              const: "storageFolderRequired"
        -
          type: "object"
          additionalProperties: false
          required: ["state","language"]
          properties:
            state:
              const: "ready"
            language: {"$ref":"#/components/schemas/Language"}
    StorageFolder:
      type: "object"
      additionalProperties: false
      required: ["folderId","suggestedFolderName"]
      properties:
        folderId:
          type: ["string","null"]
          minLength: 1
          description: "선택한 폴더. 미지정이면 null."
        suggestedFolderName:
          type: "string"
          minLength: 1
    StorageFolderUpdate:
      type: "object"
      additionalProperties: false
      required: ["folderId"]
      properties:
        folderId:
          type: "string"
          description: "서비스가 발급한 불투명 식별자."
          minLength: 1
    DriveItem:
      type: "object"
      additionalProperties: false
      required: ["id","parentId","name","kind","sizeBytes","modifiedAt","isShared","fileType","isLitpageDocument"]
      properties:
        id:
          type: "string"
          description: "서비스가 발급한 불투명 식별자."
          minLength: 1
        parentId:
          type: ["string","null"]
          minLength: 1
        name:
          type: "string"
          minLength: 1
        kind:
          type: "string"
          enum: ["folder","file"]
        sizeBytes:
          type: ["integer","null"]
          minimum: 0
          description: "파일 크기. 폴더 크기 집계 방식은 [미확인]이며 값이 없으면 null."
        modifiedAt:
          type: "string"
          format: "date-time"
        isShared:
          type: "boolean"
        fileType:
          type: ["string","null"]
          description: "파일 형식 또는 알 수 없는 경우 null. 폴더는 null."
        isLitpageDocument:
          type: "boolean"
    FolderCreate:
      type: "object"
      additionalProperties: false
      required: ["name"]
      properties:
        name:
          type: "string"
          minLength: 1
        parentId:
          type: ["string","null"]
          minLength: 1
    FolderUpdate:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
        parentId:
          type: ["string","null"]
          minLength: 1
      minProperties: 1
    FileUpload:
      type: "object"
      additionalProperties: false
      required: ["file"]
      properties:
        folderId:
          type: "string"
          description: "대상 폴더. 생략하면 루트."
          minLength: 1
        file: {"$ref":"#/components/schemas/Binary"}
    FolderManifest:
      type: "object"
      additionalProperties: false
      required: ["folderName","directories","filePaths"]
      properties:
        folderName:
          type: "string"
          minLength: 1
        directories:
          type: "array"
          items:
            type: "string"
            description: "업로드 루트 아래의 상대 디렉터리 경로. 빈 하위 폴더도 기재."
            minLength: 1
        filePaths:
          type: "array"
          items:
            type: "string"
            description: "업로드 루트 아래의 상대 파일 경로."
            minLength: 1
    FolderUpload:
      type: "object"
      additionalProperties: false
      required: ["manifest"]
      properties:
        folderId:
          type: "string"
          description: "대상 폴더. 생략하면 루트."
          minLength: 1
        manifest: {"$ref":"#/components/schemas/FolderManifest"}
        files:
          type: "array"
          items: {"$ref":"#/components/schemas/Binary"}
          description: "manifest.filePaths에 대응하는 반복 바이너리 파트. 상대 경로와 바이트 파트는 같은 순서로 일대일 대응한다. 파일이 없는 폴더는 이 필드를 생략한다. 파트 수와 경로 수가 일치해야 한다. 중복 경로, 절대 경로 및 상위 경로 이동은 허용하지 않는다."
    FolderUploadResult:
      type: "object"
      additionalProperties: false
      required: ["folder","skipped"]
      properties:
        folder: {"$ref":"#/components/schemas/DriveItem"}
        skipped:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required: ["relativePath","code"]
            properties:
              relativePath:
                type: "string"
                minLength: 1
              code:
                type: "string"
                enum: ["FILE_TOO_LARGE","EMPTY_FILE"]
    TrashItem:
      type: "object"
      additionalProperties: false
      required: ["id","name","kind","sizeBytes","remainingCalendarDays","originalFolderPath"]
      properties:
        id:
          type: "string"
          description: "서비스가 발급한 불투명 식별자."
          minLength: 1
        name:
          type: "string"
          minLength: 1
        kind:
          type: "string"
          enum: ["folder","file"]
        sizeBytes:
          type: ["integer","null"]
          minimum: 0
        remainingCalendarDays:
          type: "integer"
          minimum: 0
        originalFolderPath:
          type: "string"
          description: "사용자에게 표시할 원래 폴더 위치."
    RecipientLookup:
      type: "object"
      additionalProperties: false
      required: ["email"]
      properties:
        email:
          type: "string"
          format: "email"
    ShareRecipient:
      type: "object"
      additionalProperties: false
      required: ["id","displayName"]
      properties:
        id:
          type: "string"
          description: "서비스가 발급한 불투명 식별자."
          minLength: 1
        displayName:
          type: "string"
          description: "표시 이름 또는 미설정 시 Google 이름."
    MemberShareSettings:
      oneOf:
        -
          type: "object"
          additionalProperties: false
          required: ["permission","downloadAllowed"]
          properties:
            permission:
              const: "view"
            downloadAllowed:
              type: "boolean"
        -
          type: "object"
          additionalProperties: false
          required: ["permission"]
          properties:
            permission:
              const: "edit"
    MemberShare:
      type: "object"
      additionalProperties: false
      required: ["recipient","settings"]
      properties:
        recipient: {"$ref":"#/components/schemas/ShareRecipient"}
        settings: {"$ref":"#/components/schemas/MemberShareSettings"}
    EditResult:
      type: "object"
      additionalProperties: false
      required: ["outcome","itemId","revision"]
      properties:
        outcome:
          type: "string"
          enum: ["saved","conflictCopySaved"]
        itemId:
          type: "string"
          description: "서비스가 발급한 불투명 식별자."
          minLength: 1
        revision:
          type: "string"
          description: "파일 버전을 식별하는 불투명한 값."
          minLength: 1
    LinkSettings:
      oneOf:
        -
          type: "object"
          additionalProperties: false
          required: ["enabled"]
          properties:
            enabled:
              const: false
        -
          type: "object"
          additionalProperties: false
          required: ["enabled","url","downloadAllowed"]
          properties:
            enabled:
              const: true
            url:
              type: "string"
              format: "uri-reference"
            downloadAllowed:
              type: "boolean"
    LinkUpdate:
      type: "object"
      additionalProperties: false
      required: ["downloadAllowed"]
      properties:
        downloadAllowed:
          type: "boolean"
    PublicLink:
      type: "object"
      additionalProperties: false
      required: ["name","sizeBytes","downloadAllowed"]
      properties:
        name:
          type: "string"
          minLength: 1
        sizeBytes:
          type: "integer"
          minimum: 0
        downloadAllowed:
          type: "boolean"
    AdminMember:
      type: "object"
      additionalProperties: false
      required: ["id","displayName","email","suspended"]
      properties:
        id:
          type: "string"
          description: "서비스가 발급한 불투명 식별자."
          minLength: 1
        displayName:
          type: "string"
        email:
          type: "string"
