spring.application.name=naru-api
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:naruworks_local}
spring.datasource.username=${POSTGRES_USER:naruworks_local}
spring.datasource.password=${POSTGRES_PASSWORD:change_me_local_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.client.registration.idp.client-id=${IDP_CLIENT_ID:naru-api}
spring.security.oauth2.client.registration.idp.client-secret=${IDP_CLIENT_SECRET}
spring.security.oauth2.client.registration.idp.scope=openid,email,profile
spring.security.oauth2.client.registration.idp.redirect-uri=${IDP_LOGIN_REDIRECT_URI:http://localhost:8081/login/oauth2/code/idp}
spring.security.oauth2.client.provider.idp.issuer-uri=${IDP_ISSUER_URI:http://localhost:8180/realms/naruworks}

# 비회원의 IdP 사용자 삭제용 서비스 계정. /admin은 공개 주소에서 막혀 있어 내부 주소를 쓴다. 시크릿이 비면 삭제를 건너뛴다
naru.idp.admin.base-url=${IDP_ADMIN_BASE_URL:http://localhost:8180}
naru.idp.admin.client-id=${IDP_ADMIN_CLIENT_ID:naru-api-admin}
naru.idp.admin.client-secret=${IDP_ADMIN_CLIENT_SECRET:}

naru.frontend-base-url=http://localhost:3000
naru.google-calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
naru.google-calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
naru.google-calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8081/api/calendar/integrations/google/callback}
naru.google-calendar.token-encryption-key=${GOOGLE_CALENDAR_TOKEN_ENCRYPTION_KEY:}
