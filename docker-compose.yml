services:
  postgres:
    image: postgres:17-alpine
    container_name: naruworks-postgres
    environment:
      POSTGRES_DB: naruworks
      POSTGRES_USER: naruworks
      POSTGRES_PASSWORD: naruworks
    ports:
      - "5432:5432"
    volumes:
      - naruworks-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naruworks -d naruworks"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naruworks-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  naruworks-postgres-data:
