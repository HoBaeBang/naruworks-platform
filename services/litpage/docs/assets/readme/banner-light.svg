<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440" role="img" aria-labelledby="t d">
  <title id="t">Litpage</title>
  <desc id="d">Litpage, an open-source self-hosted workspace for pages, databases and AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#18181b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="1270" cy="210" r="260" fill="url(#glow)"/>

  <!-- mark + wordmark -->
  <g transform="translate(96 118)">
    <rect x="0" y="0" width="76" height="76" rx="19" fill="#ffffff" stroke="#27272a" stroke-width="6"/>
    <path d="M20 31h36M20 49h22" stroke="#27272a" stroke-width="7" stroke-linecap="round"/>
    <text x="104" y="60" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#18181b" letter-spacing="-1.5">Litpage</text>
  </g>
  <text x="96" y="268" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#27272a" letter-spacing="-0.5">Your self-hosted workspace for</text>
  <text x="96" y="314" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#4f46e5" letter-spacing="-0.5">pages, databases and AI.</text>
  <text x="96" y="366" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#52525b">Open source (MIT)  |  One Node.js process with SQLite  |  English and Korean</text>

