spring.application.name=naru-api
naru.frontend-base-url=http://localhost:3000
naru.initial-admin-email=${NARU_INITIAL_ADMIN_EMAIL:}
naru.cors.allowed-origins=http://localhost:3000,https://app.naruworks.com
naru.google-calendar.sync.enabled=${NARU_GOOGLE_CALENDAR_SYNC_ENABLED:true}
naru.google-calendar.sync.fixed-delay=${NARU_GOOGLE_CALENDAR_SYNC_FIXED_DELAY:PT30M}
naru.google-calendar.sync.initial-delay=${NARU_GOOGLE_CALENDAR_SYNC_INITIAL_DELAY:PT1M}
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=7d
