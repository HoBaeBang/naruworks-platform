openapi: "3.1.0"
info:
  title: "NaruWorks API"
  version: "v0.4"
  description: "v0.4 · 2026-11-26 (KST) · 초안, Gemini 검토 대기. 기획 develop 2f1db92, 05·06 v0.4, ADR 0003·0004, 09 인증 v0.2·08 DB v0.2 정합, 호배님 21:45 KST Litpage SSO B-1 결정 반영. 경로·요청 형식·응답 및 상태 코드는 07의 설계 제안이다. 개별 업로드 초과 413은 06 §6의 매핑을 따른다. x-contract-status: outline은 후속 설계에서 확정하는 경계의 윤곽이다."
servers:
  -
    url: "/api/v1"
    description: "제안 API 접두사. 배포 호스트 [미확인]."
security:
  -
    sessionCookie: []
tags:
  -
    name: "Auth"
    description: "Google 로그인과 세션"
  -
    name: "OIDC"
    description: "나루 OP와 Litpage RP의 B-1 인증 및 로그아웃 계약"
  -
    name: "Account"
    description: "계정·프로필"
  -
    name: "Catalog"
    description: "홈·공통 헤더에 쓰는 카테고리·서비스"
  -
    name: "Legal"
    description: "공개 문서"
  -
    name: "Litpage"
    description: "Litpage 진입·저장 폴더·자동 저장"
  -
    name: "Drive"
    description: "드라이브 파일·폴더"
  -
    name: "Trash"
    description: "휴지통"
  -
    name: "Sharing"
    description: "회원 공유 및 공개 링크 관리"
  -
    name: "PublicLinks"
    description: "비회원 링크 보기"
  -
    name: "Admin"
    description: "관리자 회원·오픈소스·카테고리"
paths:
  "/auth/google/start":
    get:
      tags: ["Auth"]
      operationId: "startGoogleLogin"
      summary: "Google 로그인 시작"
      description: |-
        로그인 화면의 언어 전환은 UI에서 처리한다. returnTo가 유효한 나루 내부 화면 또는 링크 보기 주소이면 로그인 흐름에 묶는다. 이미 유효한 세션이면 Google 대신 홈으로 이동한다(DEC-118·119).

        근거 ID · FR-AUTH-001, FR-SHELL-001, FR-DRV-007. AC-FR-AUTH-001-01, AC-FR-AUTH-001-02, AC-FR-AUTH-001-04, AC-FR-AUTH-001-05, AC-FR-AUTH-001-06, AC-FR-SHELL-001-05, AC-FR-SHELL-001-06, AC-FR-DRV-007-04.
      security:
        - {}
        -
          sessionCookie: []
      parameters:
        - {"$ref":"#/components/parameters/ReturnTo"}
      responses:
        "303":
          description: "Google 인증 화면 또는 이미 로그인한 회원의 홈으로 이동."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
            Location: {"$ref":"#/components/headers/Location"}
        "400": {"$ref":"#/components/responses/InvalidRequest"}
        "500": {"$ref":"#/components/responses/InternalError"}
  "/auth/google/callback":
    get:
      tags: ["Auth"]
      operationId: "completeGoogleLogin"
      summary: "Google 인증 결과 처리"
      description: |-
        Google 응답과 로그인 흐름을 검증한다. state와 함께 성공 시 code, 취소·실패 시 error 중 하나를 확인한다. 취소·인증 실패는 다시 시도할 수 있는 로그인 화면으로 돌려보낸다. 신규 회원은 승인 없이 가입하고, 성공 시 쿠키 발급 후 보관한 복귀 주소 또는 홈으로 이동한다. 보관 중 재가입은 데이터를 복구하되 회수된 받은 공유는 복구하지 않는다. 정지 회원도 기간 내 데이터 복구는 수행하되 정지 상태를 유지하고 세션을 발급하지 않는다. 30일 경과 후 새 데이터로 시작한다. 정지 시 로그인 차단 화면에서 로그인 화면으로 돌아갈 수 있다.

        근거 ID · FR-AUTH-001, FR-AUTH-004, FR-AUTH-005, FR-HOME-001. AC-FR-AUTH-001-01, AC-FR-AUTH-001-02, AC-FR-AUTH-001-03, AC-FR-AUTH-001-05, AC-FR-AUTH-004-01, AC-FR-AUTH-004-02, AC-FR-AUTH-004-04, AC-FR-AUTH-005-01, AC-FR-AUTH-005-02, AC-FR-AUTH-005-03, AC-FR-HOME-001-01.
      security: []
      parameters:
        - {"$ref":"#/components/parameters/GoogleCode"}
        - {"$ref":"#/components/parameters/GoogleState"}
        - {"$ref":"#/components/parameters/GoogleError"}
      responses:
        "303":
          description: "로그인 성공 시 홈 또는 복귀 주소. 인증 취소·실패 시 로그인 화면. 세션 쿠키는 로그인 성공 시에만 발급한다."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
            Location: {"$ref":"#/components/headers/Location"}
            Set-Cookie: {"$ref":"#/components/headers/SessionCookie"}
        "400":
          description: "INVALID_LOGIN_CALLBACK — 로그인 흐름을 검증할 수 없음."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["INVALID_LOGIN_CALLBACK"]
        "403":
          description: "MEMBER_SUSPENDED — 정지 회원은 다시 로그인하거나 갱신·Litpage 진입을 할 수 없음."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["MEMBER_SUSPENDED"]
            "text/html":
              schema: {"$ref":"#/components/schemas/Text"}
        "500": {"$ref":"#/components/responses/InternalError"}
  "/auth/session":
    get:
      tags: ["Auth"]
      operationId: "getSession"
      summary: "현재 세션과 복구 안내 상태 조회"
      description: |-
        유효한 현재 나루 세션의 관리자 여부와 이번 로그인에서 발생한 복구 안내 상태를 반환한다. 홈 진입 후 복구 안내를 표시한다. 유휴 7일 또는 로그인 시작 후 절대 30일 중 먼저 도달하면 재로그인한다. 정지로 이미 열린 세션을 즉시 종료하지 않는다.

        같은 오리진 응답의 X-CSRF-Token 헤더로 현재 CSRF 값을 전달한다. 복구 안내를 한 번만 표시하는 UI 상태 관리 방식은 [미확인]이다.

        근거 ID · FR-AUTH-001, FR-AUTH-004, FR-AUTH-005, FR-HOME-001, FR-SHELL-001. AC-FR-AUTH-001-02, AC-FR-AUTH-001-06, AC-FR-AUTH-004-01, AC-FR-AUTH-004-03, AC-FR-AUTH-005-02, AC-FR-HOME-001-01, AC-FR-SHELL-001-01, AC-FR-SHELL-001-04. AC-NFR-SEC-006-01.
      responses:
        "200":
          description: "조회 또는 변경 완료."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
            X-CSRF-Token: {"$ref":"#/components/headers/CsrfToken"}
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Session"}
        "401": {"$ref":"#/components/responses/SessionRequired"}
        "500": {"$ref":"#/components/responses/InternalError"}
  "/auth/session/refresh":
    post:
      tags: ["Auth"]
      operationId: "refreshSession"
      summary: "세션 갱신 경계"
      description: |-
        유효한 세션의 최신 회원 상태를 확인하고 정지 또는 만료라면 갱신을 거부한다. 성공하면 절대 만료 기준을 유지하면서 쿠키 자격과 CSRF 값을 회전한다. 갱신 주기와 열린 세션 차단 상한(Q-087)은 [미확인]이다.

        근거 ID · FR-AUTH-005. AC-FR-AUTH-005-02, AC-FR-AUTH-005-04. AC-NFR-SEC-002-01, AC-NFR-SEC-006-01.
      x-contract-status: "outline"
      security:
        -
          sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: "완료. 응답 본문 없음."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
            Set-Cookie: {"$ref":"#/components/headers/SessionCookie"}
            X-CSRF-Token: {"$ref":"#/components/headers/CsrfToken"}
        "401": {"$ref":"#/components/responses/SessionRequired"}
        "403":
          description: "MEMBER_SUSPENDED — 정지 회원은 다시 로그인하거나 갱신·Litpage 진입을 할 수 없음. CSRF_REJECTED — 요청의 CSRF 검증 실패."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["MEMBER_SUSPENDED","CSRF_REJECTED"]
        "500": {"$ref":"#/components/responses/InternalError"}
  "/auth/logout":
    post:
      tags: ["Auth"]
      operationId: "logoutCurrentDevice"
      summary: "현재 기기 통합 로그아웃"
      description: |-
        유효 세션이 있으면 CSRF 확인 후 현재 기기에 연계된 나루와 Litpage 세션을 종료하고 나루 쿠키를 제거한다. 다른 기기 세션은 유지한다. 유효 세션이 없으면 추가 상태 변경 없이 성공한다. B-1에서 현재 sid의 세션 폐기와 백채널 전파 기록을 저장한다. 응답 뒤 RP 전파가 이어질 수 있다.

        근거 ID · FR-AUTH-002, FR-SHELL-001, FR-OSS-001. AC-FR-AUTH-002-01, AC-FR-AUTH-002-02, AC-FR-AUTH-002-03, AC-FR-SHELL-001-01, AC-FR-OSS-001-01. AC-NFR-SEC-001-01.
      security:
        - {}
        -
          sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: "완료. 응답 본문 없음."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
            Set-Cookie: {"$ref":"#/components/headers/SessionCookie"}
        "403":
          description: "CSRF_REJECTED — 요청의 CSRF 검증 실패."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["CSRF_REJECTED"]
        "500": {"$ref":"#/components/responses/InternalError"}
  "/account/profile":
    get:
      tags: ["Account"]
      operationId: "getProfile"
      summary: "본인 프로필 조회"
      description: |-
        Google 이름·이메일·사진은 읽기 전용이다. 표시 이름을 정하기 전에는 Google 이름을 대신 사용한다. 드라이브 사용량은 바이트 단위이며 총용량 한도는 없다. 계정 설정 링크는 프로필에서 제공한다.

        근거 ID · FR-SHELL-003, FR-AUTH-006. AC-FR-SHELL-003-01, AC-FR-SHELL-003-04, AC-FR-SHELL-003-05, AC-FR-SHELL-003-06, AC-FR-SHELL-003-09, AC-FR-AUTH-006-01.
      responses:
        "200":
          description: "조회 또는 변경 완료."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Profile"}
        "401": {"$ref":"#/components/responses/SessionRequired"}
        "500": {"$ref":"#/components/responses/InternalError"}
    patch:
      tags: ["Account"]
      operationId: "updateProfile"
      summary: "표시 이름·언어·테마 저장"
      description: |-
        표시 이름은 한글·영문·숫자만 허용한다. 가중 길이 2~20(한글 2, 영문·숫자 1), 빈 값·중복 금지, 탈퇴 보관 중 예약 및 보관 종료 후 재사용을 적용한다(BR-026). 읽기 전용 Google 정보는 변경할 수 없다. 언어·테마는 계정에 저장한다(DEC-100·101·110·113).

        근거 ID · FR-SHELL-003, FR-AUTH-001, FR-OSS-001. AC-FR-SHELL-003-02, AC-FR-SHELL-003-03, AC-FR-SHELL-003-04, AC-FR-SHELL-003-05, AC-FR-SHELL-003-07, AC-FR-SHELL-003-08, AC-FR-SHELL-003-09, AC-FR-AUTH-001-04, AC-FR-OSS-001-03. AC-NFR-I18N-002-01, AC-NFR-USAB-002-01.
      security:
        -
          sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ProfileUpdate"}
      responses:
        "200":
          description: "조회 또는 변경 완료."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/Profile"}
        "400": {"$ref":"#/components/responses/InvalidRequest"}
        "401": {"$ref":"#/components/responses/SessionRequired"}
        "403":
          description: "CSRF_REJECTED — 요청의 CSRF 검증 실패."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["CSRF_REJECTED"]
        "409":
          description: "DISPLAY_NAME_UNAVAILABLE — 이미 쓰고 있거나 탈퇴 보관 중 예약된 표시 이름."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["DISPLAY_NAME_UNAVAILABLE"]
        "422":
          description: "INVALID_DISPLAY_NAME — 표시 이름 규칙 위반."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["INVALID_DISPLAY_NAME"]
        "500": {"$ref":"#/components/responses/InternalError"}
  "/account":
    delete:
      tags: ["Account"]
      operationId: "withdrawAccount"
      summary: "회원 탈퇴"
      description: |-
        계정 설정에서 확인한 후에만 요청한다. 취소는 UI 동작이다. 탈퇴 후 계정 사용을 막고 달력 날짜 30일 동안 데이터를 보관한다. 받은 공유는 즉시 회수하고, 보관 중 소유 공유·링크는 보기만 허용한다. 휴지통 시계는 계속 간다. 완료 후 UI가 안내하고 로그인으로 이동한다. 정지 상태의 열린 세션에서 탈퇴를 실행할 수 있는지는 [미확인]이다.

        근거 ID · FR-AUTH-003, FR-AUTH-006, FR-SHELL-003, FR-DRV-004, FR-DRV-006, FR-DRV-007. AC-FR-AUTH-003-01, AC-FR-AUTH-003-02, AC-FR-AUTH-003-03, AC-FR-AUTH-006-01, AC-FR-SHELL-003-07, AC-FR-SHELL-003-08, AC-FR-DRV-004-07, AC-FR-DRV-006-06, AC-FR-DRV-006-07, AC-FR-DRV-007-06. AC-NFR-SEC-004-01.
      security:
        -
          sessionCookie: []
          csrfHeader: []
      responses:
        "204":
          description: "완료. 응답 본문 없음."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
            Set-Cookie: {"$ref":"#/components/headers/SessionCookie"}
        "401": {"$ref":"#/components/responses/SessionRequired"}
        "403":
          description: "CSRF_REJECTED — 요청의 CSRF 검증 실패."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema:
                allOf:
                  - {"$ref":"#/components/schemas/Error"}
                  -
                    properties:
                      code:
                        enum: ["CSRF_REJECTED"]
        "500": {"$ref":"#/components/responses/InternalError"}
  "/catalog/categories":
    get:
      tags: ["Catalog"]
      operationId: "listCategories"
      summary: "홈·헤더 카테고리 목록"
      description: |-
        서비스가 없는 카테고리도 포함한다. 입력된 카테고리 이름을 그대로 사용하고, 기본 문서·저장소와 관리자 변경을 반영한다(DEC-120).

        근거 ID · FR-HOME-001, FR-HOME-002, FR-SHELL-001, FR-ADM-004. AC-FR-HOME-001-01, AC-FR-HOME-002-01, AC-FR-HOME-002-02, AC-FR-SHELL-001-01, AC-FR-SHELL-001-03, AC-FR-ADM-004-01, AC-FR-ADM-004-02.
      parameters:
        - {"$ref":"#/components/parameters/Cursor"}
        - {"$ref":"#/components/parameters/Limit"}
      responses:
        "200":
          description: "조회 또는 변경 완료."
          headers:
            X-Request-Id: {"$ref":"#/components/headers/RequestId"}
            Cache-Control: {"$ref":"#/components/headers/NoStore"}
          content:
            "application/json":
              schema: {"$ref":"#/components/schemas/CategoryPage"}
        "400": {"$ref":"#/components/responses/InvalidRequest"}
        "401": {"$ref":"#/components/responses/SessionRequired"}
        "500": {"$ref":"#/components/responses/InternalError"}
  "/catalog/services":
    get:
      tags: ["Catalog"]
      operationId: "listServices"
      summary: "이용 가능한 서비스 목록"
      description: |-
        홈과 헤더가 같은 노출 목록을 사용한다. 숨긴 오픈소스는 모든 회원에게 제외한다. 각 서비스는 한 카테고리에 속하며 나루 드라이브는 유지한다.

        근거 ID · FR-HOME-001, FR-HOME-002, FR-SHELL-001, FR-OSS-001, FR-ADM-003, FR-ADM-004. AC-FR-HOME-001-01, AC-FR-HOME-001-02, AC-FR-HOME-002-01, AC-FR-HOME-002-02, AC-FR-SHELL-001-01, AC-FR-SHELL-001-02, AC-FR-SHELL-001-03, AC-FR-OSS-001-02, AC-FR-ADM-003-01, AC-FR-ADM-003-02, AC-FR-ADM-004-01, AC-FR-ADM-004-02.
