name: 릴리즈
description: develop의 검증된 변경을 main으로 릴리즈합니다.
title: "[릴리즈] "
labels: ["release"]
body:
  - type: textarea
    id: release-scope
    attributes:
      label: 릴리즈 범위
      description: 이번 릴리즈에 포함할 이슈와 사용자 관점의 변경 사항을 작성합니다.
      placeholder: |
        - #12 캘린더 ...
        - #15 회원 ...
    validations:
      required: true
  - type: textarea
    id: deployment-plan
    attributes:
      label: 배포와 롤백 계획
      description: 현재는 홈서버 수동 배포 절차와 문제가 생겼을 때 되돌릴 기준을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 릴리즈 검증
      description: CI, Docker Compose, 운영 도메인에서 확인할 항목을 작성합니다.
      placeholder: |
        - [ ] Backend Test / Frontend Quality CI 통과
        - [ ] Docker Compose 실행 확인
        - [ ] 운영 도메인 핵심 흐름 확인
    validations:
      required: true
