services:
  postgres:
    image: postgres:17-alpine
    container_name: naruworks-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naruworks_local}
      POSTGRES_USER: ${POSTGRES_USER:-naruworks_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
    ports:
      - "5432:5432"
    volumes:
      - naruworks-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naruworks-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: naruworks-frontend
    environment:
      CATALOG_API_BASE_URL: ${CATALOG_API_BASE_URL:-http://backend:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  naruworks-postgres-data:
